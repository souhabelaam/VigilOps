# Tells Grafana at start-up: (1) where Prometheus is, (2) where to find dashboard files.
# Nothing is clicked by hand, so a fresh Grafana pod always looks the same.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: vigilops
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: vigilops
        type: file
        options:
          path: /var/lib/grafana/dashboards
