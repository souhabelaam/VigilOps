apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detection
  namespace: vigilops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-detection
  template:
    metadata:
      labels:
        app: anomaly-detection
    spec:
      enableServiceLinks: false   # do not inject RABBITMQ_PORT=tcp://... style variables: our code reads those names
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: anomaly-detection
          image: registry.gitlab.com/souhabenelaam/vigilops/anomaly-detection:2581ffdb
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef: {name: vigilops-config, key: RABBITMQ_HOST}
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: {name: vigilops-secrets, key: RABBITMQ_USER}
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef: {name: vigilops-secrets, key: RABBITMQ_PASS}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 160Mi}
          readinessProbe:                  # ready once the models are loaded and the output queue is connected
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
          livenessProbe:                   # restarted if the consumer loop freezes for 15 s
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
