# One entry point for the whole platform:  kubectl apply -k k8s/
# Not in this list on purpose: kind-config.yaml (it configures the cluster itself, not an object inside it)
# and secret.yaml.example (the real Secret is created from .env, see that file).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres/init-configmap.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - rabbitmq/pvc.yaml
  - rabbitmq/deployment.yaml
  - rabbitmq/service.yaml
  - notes-api/deployment.yaml
  - notes-api/service.yaml
  - report-api/deployment.yaml
  - report-api/service.yaml
  - collector/deployment.yaml
  - ingestion/deployment.yaml
  - anomaly-detection/deployment.yaml
  - alerting/deployment.yaml
  - monitoring/prometheus/configmap.yaml
  - monitoring/prometheus/deployment.yaml
  - monitoring/prometheus/service.yaml
  - monitoring/grafana/provisioning-configmap.yaml
  - monitoring/grafana/dashboard-configmap.yaml
  - monitoring/grafana/deployment.yaml
  - monitoring/grafana/service.yaml

# THE place to change versions: kustomize rewrites the tag of each image listed here,
# whatever tag is written in the deployment files. CI pushes tags named after the commit.
images:
  - name: registry.gitlab.com/souhabenelaam/vigilops/notes-api
    newTag: 2581ffdb
  - name: registry.gitlab.com/souhabenelaam/vigilops/report-api
    newTag: 2581ffdb
  - name: registry.gitlab.com/souhabenelaam/vigilops/collector
    newTag: 2581ffdb
  - name: registry.gitlab.com/souhabenelaam/vigilops/ingestion
    newTag: 2581ffdb
  - name: registry.gitlab.com/souhabenelaam/vigilops/anomaly-detection
    newTag: 2581ffdb
  - name: registry.gitlab.com/souhabenelaam/vigilops/alerting
    newTag: 2581ffdb
