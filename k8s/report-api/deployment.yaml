apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: vigilops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: report-api
          image: registry.gitlab.com/souhabenelaam/vigilops/report-api:2581ffdb
          ports:
            - containerPort: 8002
          env:
            - name: FAULTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vigilops-config
                  key: FAULTS_ENABLED
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:               # same ceiling as Compose
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
