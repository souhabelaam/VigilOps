apiVersion: v1
kind: Service
metadata:
  name: report-api                  # other pods reach it at http://report-api:8002
  namespace: vigilops
spec:
  type: NodePort
  selector:
    app: report-api
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30003               # kind-config.yaml maps this to host port 8002
