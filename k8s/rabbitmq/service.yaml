apiVersion: v1
kind: Service
metadata:
  name: rabbitmq              # the name the services use (RABBITMQ_HOST=rabbitmq)
  namespace: vigilops
spec:
  selector:
    app: rabbitmq
  ports:                      # one Service can open several ports: each one needs a name
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
