apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: vigilops
spec:
  replicas: 1
  strategy:
    type: Recreate              # never two RabbitMQ on one disk
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine   # "management" adds the web page on port 15672
          ports:
            - name: amqp
              containerPort: 5672     # services send and receive messages here
            - name: management
              containerPort: 15672    # the web page
          env:
            # TRAP: RabbitMQ stores its data in a folder named after the node name, which by default
            # contains the host name. A new pod has a new host name, so it would NOT find the old data.
            # A fixed node name keeps the same folder across restarts.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: vigilops-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: vigilops-secrets
                  key: RABBITMQ_PASS
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10      # this command is slow: give it time
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
