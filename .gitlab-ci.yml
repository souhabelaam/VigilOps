# Parent pipeline: it only decides which child pipeline to start.
# A child starts only when files of its own area changed.
stages:
  - security
  - pipelines
  - deploy

services-pipeline:     # not just "services": that is a reserved GitLab CI word
  stage: pipelines
  trigger:
    include: ci/services.yml
    strategy: depend        # the parent is green only if the child is green
  rules:
    # On main it ALWAYS runs: all 6 images are built for every commit, so the tag the deploy job
    # uses ($CI_COMMIT_SHORT_SHA) exists even when the commit only changed k8s/ or docs/.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # On other branches it only runs when something it cares about changed.
    - changes:
        - .gitlab-ci.yml
        - services/**/*
        - ci/services.yml
        - ruff.toml

ml-pipeline:
  stage: pipelines
  trigger:
    include: ci/ml.yml
    strategy: depend
  rules:
    - changes:
        - .gitlab-ci.yml
        - ml/**/*
        - ci/ml.yml
        - ruff.toml

# Secrets scan: runs on EVERY push, whatever changed, because a secret can land anywhere.
# It reads the whole git history, so a password committed once and deleted later is still found.
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]        # the image starts gitleaks by itself; GitLab needs a shell instead
  variables:
    GIT_DEPTH: 0            # fetch the full history (GitLab clones only the last 20 commits by default)
  script:
    - gitleaks detect --source . --redact --no-banner --verbose   # --redact: never print the secret itself

# Code scan: matches the Python source against known risky patterns (injection, weak crypto, ...).
# --error makes the job fail when something is found; --metrics=off sends nothing to semgrep.dev.
semgrep:
  stage: security
  image: semgrep/semgrep:1.99.0
  script:
    - semgrep scan --config p/python --metrics=off --error .

# Dependency scan: compares the libraries in every requirements.txt with the public CVE database.
# HIGH is only shown; CRITICAL fails the job. --ignore-unfixed hides issues nobody can fix yet.
trivy-deps:
  stage: security
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress --skip-dirs ml/data .
    - trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --skip-dirs ml/data .

# Deploy: runs on YOUR laptop runner (tag "laptop"), because only it can reach the kind cluster.
# Only on main, and only after the stages before it are green (scans, tests, images built).
# The job logs in as the "gitlab-deployer" robot (limited to the vigilops namespace, no right on
# plain Secrets): its kubeconfig comes from the masked + protected variable KUBECONFIG_B64.
deploy:
  stage: deploy
  tags:
    - laptop
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache kubectl kustomize
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    # Point every image at the tag built by THIS commit (changes the job's copy of the file only).
    - |
      cd k8s
      for svc in notes-api report-api collector ingestion anomaly-detection alerting; do
        kustomize edit set image $CI_REGISTRY_IMAGE/$svc=$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA
      done
      cd ..
    - kubectl apply -k k8s/
    # Wait until every Deployment has rolled out; a broken release makes the job (and pipeline) fail.
    - |
      for d in postgres rabbitmq notes-api report-api collector ingestion anomaly-detection alerting prometheus grafana; do
        kubectl rollout status deployment/$d --timeout=300s
      done
    - kubectl get pods
