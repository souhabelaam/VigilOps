services:
  notes-api:
    build: ./services/notes-api
    ports:
      - "8001:8001"
    environment:
      FAULTS_ENABLED: "true"   # lets the fault injector break this app; never set in production
    restart: unless-stopped    # a crash fault is followed by an automatic restart
    mem_limit: 256m            # keeps the whole stack inside the 8 GB laptop
    cpus: 0.5

  report-api:
    build: ./services/report-api
    ports:
      - "8002:8002"
    environment:
      FAULTS_ENABLED: "true"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  collector:
    build: ./services/collector
    environment:
      RABBITMQ_HOST: rabbitmq      # inside Compose, a service is reached by its name
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
      - notes-api
      - report-api
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  ingestion:
    build: ./services/ingestion
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  anomaly-detection:
    build: ./services/anomaly-detection
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.25

  rabbitmq:
    image: rabbitmq:3.13-management-alpine   # "management" adds a web page to look inside the queues
    ports:
      - "5672:5672"     # the port services use to send and receive messages
      - "15672:15672"   # the management web page
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}   # read from the git-ignored .env file
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}   # from the git-ignored .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vigilops
    volumes:
      - pgdata:/var/lib/postgresql/data                       # keeps the data when the container is removed
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates the table on first start
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
