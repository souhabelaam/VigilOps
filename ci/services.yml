# Child pipeline: the 6 services in services/. Same steps for each, written once.
stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff==0.14.0
    - ruff check services

# A job whose name starts with a dot never runs. It is a template: other jobs copy it with `extends`.
.test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd services/$SERVICE
    - pip install --quiet -r requirements-dev.txt
  script:
    - python -m pytest -q

test-notes-api:
  extends: .test
  variables:
    SERVICE: notes-api

test-report-api:
  extends: .test
  variables:
    SERVICE: report-api

test-collector:
  extends: .test
  variables:
    SERVICE: collector

test-ingestion:
  extends: .test
  variables:
    SERVICE: ingestion

test-anomaly-detection:
  extends: .test
  variables:
    SERVICE: anomaly-detection

test-alerting:
  extends: .test
  variables:
    SERVICE: alerting

# Build one image per service, to prove every Dockerfile builds on a clean machine,
# then push it to the GitLab registry tagged with the commit.
# A job needs a Docker engine to build images: the `services:` entry starts one next to the job
# (docker-in-docker), and DOCKER_HOST tells the docker client where to find it.
.build:
  stage: build
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""       # no TLS between the job and its helper: they share one private network
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA services/$SERVICE
    # GitLab gives each job a temporary login for the project registry: nothing to store or paste
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA

build-notes-api:
  extends: .build
  variables:
    SERVICE: notes-api

build-report-api:
  extends: .build
  variables:
    SERVICE: report-api

build-collector:
  extends: .build
  variables:
    SERVICE: collector

build-ingestion:
  extends: .build
  variables:
    SERVICE: ingestion

build-anomaly-detection:
  extends: .build
  variables:
    SERVICE: anomaly-detection

build-alerting:
  extends: .build
  variables:
    SERVICE: alerting
