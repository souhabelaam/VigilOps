# Child pipeline: the 6 services in services/. Same steps for each, written once.
stages:
  - lint
  - test
  - build
  - scan

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff==0.14.0
    - ruff check services

# A job whose name starts with a dot never runs. It is a template: other jobs copy it with `extends`.
.test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd services/$SERVICE
    - pip install --quiet -r requirements-dev.txt
  script:
    - python -m pytest -q

test-notes-api:
  extends: .test
  variables:
    SERVICE: notes-api

test-report-api:
  extends: .test
  variables:
    SERVICE: report-api

test-collector:
  extends: .test
  variables:
    SERVICE: collector

test-ingestion:
  extends: .test
  variables:
    SERVICE: ingestion

test-anomaly-detection:
  extends: .test
  variables:
    SERVICE: anomaly-detection

test-alerting:
  extends: .test
  variables:
    SERVICE: alerting

# Build one image per service, to prove every Dockerfile builds on a clean machine,
# then push it to the GitLab registry tagged with the commit.
# A job needs a Docker engine to build images: the `services:` entry starts one next to the job
# (docker-in-docker), and DOCKER_HOST tells the docker client where to find it.
.build:
  stage: build
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""       # no TLS between the job and its helper: they share one private network
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA services/$SERVICE
    # GitLab gives each job a temporary login for the project registry: nothing to store or paste
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA

build-notes-api:
  extends: .build
  variables:
    SERVICE: notes-api

build-report-api:
  extends: .build
  variables:
    SERVICE: report-api

build-collector:
  extends: .build
  variables:
    SERVICE: collector

build-ingestion:
  extends: .build
  variables:
    SERVICE: ingestion

build-anomaly-detection:
  extends: .build
  variables:
    SERVICE: anomaly-detection

build-alerting:
  extends: .build
  variables:
    SERVICE: alerting

# Image scan: the operating system inside each pushed image can have known holes too.
# One job for the 6 images, so the vulnerability database is downloaded once.
# HIGH is only shown; CRITICAL fails the job (after all 6 were scanned).
trivy-images:
  stage: scan
  image:
    name: aquasec/trivy:0.57.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER        # the images are in our private registry
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
    TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2   # the default mirror.gcr.io failed with BLOB_UNKNOWN
  script:
    - |
      for svc in notes-api report-api collector ingestion anomaly-detection alerting; do
        img=$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA
        echo "== $img"
        trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 $img
        trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 $img || failed=1
      done
      exit ${failed:-0}
