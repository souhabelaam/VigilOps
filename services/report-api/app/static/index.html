<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>report-api</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-glow-1: rgba(20, 184, 166, .22);
      --bg-glow-2: rgba(99, 102, 241, .22);
      --card: rgba(255, 255, 255, .06);
      --card-border: rgba(255, 255, 255, .10);
      --text: #e8eaf6;
      --muted: #8b93b5;
      --input-bg: rgba(255, 255, 255, .05);
      --accent-from: #14b8a6;
      --accent-to: #6366f1;
      --danger: #fb7185;
    }
    [data-theme="light"] {
      --bg: #f5f6fb;
      --bg-glow-1: rgba(20, 184, 166, .16);
      --bg-glow-2: rgba(99, 102, 241, .12);
      --card: #ffffff;
      --card-border: #e5e8f2;
      --text: #1c2033;
      --muted: #6b728f;
      --input-bg: #f8f9fd;
      --danger: #e11d48;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(600px 400px at 10% -5%, var(--bg-glow-1), transparent),
        radial-gradient(600px 400px at 95% 5%, var(--bg-glow-2), transparent),
        var(--bg);
      padding: 2.5rem 1rem 4rem;
      transition: background .3s, color .3s;
    }
    main { max-width: 680px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      box-shadow: 0 8px 24px rgba(20, 184, 166, .35);
    }
    h1 { margin: 0; font-size: 1.7rem; letter-spacing: -.02em; }
    .count {
      font-size: .8rem; font-weight: 600; padding: .15rem .6rem; margin-left: .5rem; border-radius: 999px;
      vertical-align: middle; color: #fff;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
    }
    #theme {
      width: 42px; height: 42px; border-radius: 12px; font-size: 1.1rem; cursor: pointer;
      background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    }

    .card {
      background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
      backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    }
    form { display: flex; flex-direction: column; gap: .9rem; padding: 1.4rem; margin-bottom: 2rem; }
    label { font-size: .85rem; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 1rem; }
    input[type=number] {
      font: inherit; color: var(--text); width: 160px; padding: .7rem .9rem; border-radius: 10px;
      background: var(--input-bg); border: 1px solid var(--card-border);
    }
    input[type=range] { flex: 1; accent-color: var(--accent-from); }
    input:focus { outline: none; border-color: var(--accent-from); box-shadow: 0 0 0 4px rgba(20, 184, 166, .22); }

    .run {
      font: inherit; font-weight: 600; color: #fff; border: none; cursor: pointer;
      padding: .85rem 1rem; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      box-shadow: 0 8px 20px rgba(20, 184, 166, .3);
      transition: transform .12s, filter .12s;
    }
    .run:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    .run:disabled { opacity: .7; cursor: wait; }
    .bar { height: 4px; border-radius: 4px; overflow: hidden; background: var(--input-bg); }
    .bar[hidden] { display: none; }
    .bar::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
      animation: slide 1s infinite ease-in-out;
    }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #error { color: var(--danger); font-size: .9rem; }
    #error:empty { display: none; }

    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .85rem; }
    li { padding: 1.1rem 1.25rem; border-left: 5px solid var(--accent-from); animation: pop .25s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .6rem; }
    .title { font-weight: 700; }
    .date { font-size: .78rem; color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
    .stat span { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat b { font-size: 1.15rem; }
    .slow { color: var(--danger); }

    #empty { text-align: center; color: var(--muted); padding: 2.5rem 0; }
    #empty .big { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="logo">⚙️</div>
      <h1>Reports<span class="count" id="count">0</span></h1>
    </div>
    <button id="theme" type="button" title="Toggle light/dark">🌙</button>
  </header>

  <form id="report-form" class="card">
    <label for="limit">Count the prime numbers up to:</label>
    <div class="row">
      <input id="limit" type="number" min="2" max="1000000" value="200000" required>
      <input id="slider" type="range" min="2" max="1000000" step="1000" value="200000">
    </div>
    <button class="run" id="run" type="submit">▶ Run report</button>
    <div class="bar" id="bar" hidden></div>
    <span id="error"></span>
  </form>

  <ul id="reports"></ul>
  <div id="empty" hidden><span class="big">📊</span>No reports yet. Run your first one above.</div>
</main>

  <script>
    const list = document.getElementById("reports");
    const form = document.getElementById("report-form");
    const errorBox = document.getElementById("error");
    const limitInput = document.getElementById("limit");
    const slider = document.getElementById("slider");
    const runButton = document.getElementById("run");
    const bar = document.getElementById("bar");

    // keep the number box and the slider in sync
    slider.addEventListener("input", () => { limitInput.value = slider.value; });
    limitInput.addEventListener("input", () => { slider.value = limitInput.value; });

    function stat(label, value, extraClass) {
      const box = document.createElement("div");
      box.className = "stat";
      const name = document.createElement("span");
      name.textContent = label;
      const number = document.createElement("b");
      number.textContent = value;
      if (extraClass) number.className = extraClass;
      box.append(name, number);
      return box;
    }

    // GET /reports -> redraw the history, newest first
    async function loadReports() {
      const response = await fetch("/reports");
      const reports = (await response.json()).reverse();
      list.replaceChildren();
      document.getElementById("empty").hidden = reports.length > 0;
      document.getElementById("count").textContent = reports.length;
      for (const report of reports) {
        const item = document.createElement("li");
        item.className = "card";

        const top = document.createElement("div");
        top.className = "top";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = "Report #" + report.id;
        const date = document.createElement("div");
        date.className = "date";
        date.textContent = new Date(report.created_at).toLocaleString();
        top.append(title, date);

        const stats = document.createElement("div");
        stats.className = "stats";
        stats.append(
          stat("Up to", report.limit.toLocaleString()),
          stat("Primes found", report.prime_count.toLocaleString()),
          stat("Duration", report.duration_seconds.toFixed(2) + " s", report.duration_seconds > 3 ? "slow" : ""),
        );

        item.append(top, stats);
        list.append(item);
      }
    }

    // POST /reports (can take several seconds: the server is computing)
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      runButton.disabled = true;
      runButton.textContent = "Computing...";
      bar.hidden = false;
      try {
        const response = await fetch("/reports", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ limit: Number(limitInput.value) }),
        });
        if (!response.ok) {
          errorBox.textContent = "Could not run the report (error " + response.status + ")";
        } else {
          await loadReports();
        }
      } catch (e) {
        errorBox.textContent = "Cannot reach the server.";
      } finally {
        runButton.disabled = false;
        runButton.textContent = "▶ Run report";
        bar.hidden = true;
      }
    });

    // Light/dark toggle, remembered in the browser (wrapped: storage can be blocked)
    const themeButton = document.getElementById("theme");
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === "dark" ? "🌙" : "☀️";
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }
    themeButton.addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });
    try { applyTheme(localStorage.getItem("theme") || "dark"); } catch (e) {}

    loadReports();
  </script>
</body>
</html>
